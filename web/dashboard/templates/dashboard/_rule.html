<details class="rule">
  <summary>Alert rule: <strong>{{ alert_rule }}</strong>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </summary>
  <form class="rule-panel" method="post" action="{% url 'settings' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <h3>When should a payment raise an alert?</h3>
    <p>Both rules use the same fraud score. They differ in where the line is drawn.</p>

    <label class="choice">
      <input type="radio" name="mode" value="cost" {% if alert_cfg.mode == 'cost' %}checked{% endif %}>
      <span><strong>Cost-based</strong><br>
        <span class="faint">Minimise missed fraud ₹ plus the cost of reviewing each alert. The line was chosen on held-out validation data.</span>
        <span class="opts">Review cost
          <select name="review_cost" aria-label="Cost of reviewing one alert">
            {% for c in cost_choices %}<option value="{{ c }}" {% if c == alert_cfg.review_cost %}selected{% endif %}>₹{{ c }}</option>{% endfor %}
          </select> per alert</span>
      </span>
    </label>
    <label class="choice">
      <input type="radio" name="mode" value="capacity" {% if alert_cfg.mode == 'capacity' %}checked{% endif %}>
      <span><strong>Analyst capacity</strong><br>
        <span class="faint">Alert on the highest-scoring share of payments in this file.</span>
        <span class="opts">Top <input type="number" name="capacity" min="0.5" max="10" step="0.5" value="{{ alert_cfg.capacity }}" aria-label="Share of payments to review"> % of payments</span>
      </span>
    </label>
    <label class="toggle">
      <input type="checkbox" name="rings" {% if alert_cfg.rings %}checked{% endif %}>
      Also flag fast pass-through payments inside mule rings
    </label>
    <button class="btn btn-primary" type="submit">Apply rule</button>
  </form>
</details>
